AWSTemplateFormatVersion: '2010-09-09'
Description: Snappy Study User API (auth, parents, kids, QR pairing, child sessions)

Parameters:
  ArtifactBucket:
    Type: String
  ArtifactKey:
    Type: String

  # ── Database ──────────────────────────────────────────────────────────────────
  DbHost:
    Type: String
  DbUser:
    Type: String
  DbPassword:
    Type: String
    NoEcho: true
  DbName:
    Type: String
    Default: 'snappy_study_user'

  # ── Auth secrets ──────────────────────────────────────────────────────────────
  JwtSecret:
    Type: String
    NoEcho: true
  GoogleClientId:
    Type: String

  # ── Apple Sign In ────────────────────────────────────────────────────────────
  # The iOS bundle id is the audience claim Apple stamps into identity tokens.
  AppleBundleId:
    Type: String
    Default: com.snappystudy.app

  # ── Email ─────────────────────────────────────────────────────────────────────
  SenderEmail:
    Type: String
    Default: 'noreply@snappystudy.com'
    Description: Verified SES sender address (domain must be verified in SES)

  # ── RevenueCat (in-app purchases) ─────────────────────────────────────────────
  RevenueCatWebhookAuth:
    Type: String
    NoEcho: true
    Default: ''
    Description: Shared secret expected in the Authorization header of RevenueCat webhooks

  SentryDsn:
    Type: String
    NoEcho: true
    Default: ''
    Description: Sentry DSN for error tracking (leave empty to disable)

  UserApiKey:
    Type: String
    NoEcho: true
    Description: Secret key required in x-api-key header for all app requests

  # ── Existing VPC where the RDS instance lives ─────────────────────────────────
  # Find these in the AWS Console:
  #   VPC ID      → VPC → Your VPCs
  #   Subnet IDs  → VPC → Subnets (pick the private subnets in the RDS VPC)
  #   RDS SG ID   → EC2 → Security Groups (the SG attached to your RDS instance)
  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: VPC where the RDS instance lives
  SubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: Private subnet IDs inside the RDS VPC (comma-separated, e.g. subnet-aaa,subnet-bbb)
  RdsSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
    Description: Security group currently attached to the RDS instance

  # ── Networking ────────────────────────────────────────────────────────────────
  PrivateRouteTableId:
    Type: String
    Description: Route table ID for the private subnets (will receive the NAT Gateway default route)

Resources:

  # ── Security group for the Lambda functions ───────────────────────────────────
  # Created in the EXISTING VPC so the Lambdas can reach the RDS.
  UserLambdaSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Snappy Study user-api Lambda - outbound to RDS
      VpcId: !Ref VpcId

  # ── Internet Gateway ─────────────────────────────────────────────────────────
  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-igw"

  VPCGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref VpcId
      InternetGatewayId: !Ref InternetGateway

  # ── Public subnet (NAT Gateway lives here) ───────────────────────────────────
  PublicSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VpcId
      CidrBlock: 10.0.10.0/24
      AvailabilityZone: eu-central-1a
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-public-eu-central-1a"

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VpcId
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-public-rt"

  PublicRoute:
    Type: AWS::EC2::Route
    DependsOn: VPCGatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnetRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet
      RouteTableId: !Ref PublicRouteTable

  # ── NAT Gateway ───────────────────────────────────────────────────────────────
  NatEIP:
    Type: AWS::EC2::EIP
    DependsOn: VPCGatewayAttachment
    Properties:
      Domain: vpc
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-nat-eip"

  NatGateway:
    Type: AWS::EC2::NatGateway
    Properties:
      AllocationId: !GetAtt NatEIP.AllocationId
      SubnetId: !Ref PublicSubnet
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-nat"

  # Route all outbound traffic from the private subnets through the NAT Gateway
  PrivateInternetRoute:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref PrivateRouteTableId
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref NatGateway

  # Allow MySQL traffic from the Lambda SG into the RDS SG.
  # This modifies the pre-existing RDS security group (no replacement needed).
  RdsIngressFromLambda:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref RdsSecurityGroupId
      IpProtocol: tcp
      FromPort: 3306
      ToPort: 3306
      SourceSecurityGroupId: !Ref UserLambdaSecurityGroup
      Description: Allow MySQL from snappy-study-user-api Lambda

  # ── IAM role shared by all Lambdas ───────────────────────────────────────────
  UserApiLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
        - arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole
      Policies:
        - PolicyName: SESsendEmail
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - ses:SendEmail
                  - ses:SendRawEmail
                Resource: '*'

  # ── Migration Lambda (no API Gateway route – invoked via AWS CLI) ─────────────
  # Usage:  bash migrate.sh
  MigrateLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-migrate"
      Runtime: nodejs22.x
      Handler: src/handlers/migrate.handler
      Role: !GetAtt UserApiLambdaRole.Arn
      Layers:
        - arn:aws:lambda:eu-central-1:943013980633:layer:SentryNodeServerlessSDKv10:63
      Code:
        S3Bucket: !Ref ArtifactBucket
        S3Key: !Ref ArtifactKey
      MemorySize: 512
      Timeout: 120
      VpcConfig:
        SubnetIds: !Ref SubnetIds
        SecurityGroupIds:
          - !Ref UserLambdaSecurityGroup
      Environment:
        Variables:
          DB_HOST: !Ref DbHost
          DB_USER: !Ref DbUser
          DB_PASSWORD: !Ref DbPassword
          DB_NAME: !Ref DbName
          JWT_SECRET: !Ref JwtSecret
          GOOGLE_CLIENT_ID: !Ref GoogleClientId
          SENTRY_DSN: !Ref SentryDsn
          NODE_OPTIONS: '--import @sentry/aws-serverless/awslambda-auto'
          USER_API_KEY: !Ref UserApiKey

